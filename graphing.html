<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphing Calculator || Graphy</title>
    <link rel="stylesheet" href="graphing.css">
</head>
<body>
    <nav>
        <div id="nav-left">
            <p>Graphy</p>
        </div>
        <div id="nav-right">
            <p>Scientific Calculator</p>
        </div>
    </nav>
    <main>
        <div id="equations">
            <div id="equations-top">
                <p id="equations-title">Equations</p>
            </div>
            <div id="equations-bottom">
                <div class="equations-input-box">
                    <div class="e-input-box-left">
                        <p class="equation-number">1</p>
                    </div>
                    <div class="vr"></div>
                    <input class="equation" type="text" autofocus name="equation">
                    <button class="equation-delete">x</button>
                </div>
            </div>
        </div>
        <canvas id="graph">
    </main>
    <template id="equation-input-template">
        <div class="equations-input-box">
            <div class="e-input-box-left">
                <p class="equation-number">1</p>
            </div>
            <div class="vr"></div>
            <input class="equation" type="text" autofocus>
            <button class="equation-delete">x</button>
        </div>
    </template>
    <script src="graphing.js"></script>
</body>
</html>
