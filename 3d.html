<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Calculator</title>
    <link rel="stylesheet" href="./3d.css">
</head>
<body>
    <nav>
        <div id="nav-left">
            <p>Graphy</p>
        </div>
        <div id="nav-right">
            <p>Scientific Calculator</p>
            <p>Graphing Calculator</p>
        </div>
    </nav>
    <main>
        <div id="equations">
            <div id="equations-top">
                <p id="equations-title">Equations</p>
            </div>
            <div id="equations-bottom">
                <div class="equations-input-box">
                    <div class="e-input-box-left">
                        <p class="equation-number">1</p>
                    </div>
                    <div class="vr"></div>
                    <input class="equation" type="text" autofocus name="equation" data-color="#ffffff">
                    <button class="equation-delete">x</button>
                    <button class="color-pick">✎</button>
                </div>
            </div>
        </div>
        <div id="maincanvas"></div>
    </main>
    <template id="equation-input-template">
        <div class="equations-input-box">
            <div class="e-input-box-left">
                <p class="equation-number">1</p>
            </div>
            <div class="vr"></div>
            <input class="equation" type="text" autofocus data-color="#ffffff">
            <button class="equation-delete">x</button>
            <button class="color-pick">✎</button>
        </div>
    </template>
    <script type="importmap">
        {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
        }
    </script>
    <script type="module" src="3dcalc.js"></script>
</body>
</html>
