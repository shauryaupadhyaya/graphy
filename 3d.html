<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Calculator</title>
    <link rel="stylesheet" href="./3d.css">
</head>
<body>
    <nav>
        <div id="nav-left">
            <a href="index.html">Graphy</a>
        </div>
        <div id="nav-right">
            <a href="calc.html">Scientific Calculator</a>
            <a href="graphing.html">Graphing Calculator</a>
        </div>
    </nav>
    <main>
        <div id="equations">
            <div id="equations-top">
                <p id="equations-title">Equations</p>
                <button id="add-equation" type="button">+</button>
            </div>
            <div id="equations-bottom">
                <div class="equations-input-box">
                    <div class="e-input-box-left">
                        <p class="equation-number">1</p>
                    </div>
                    <div class="vr"></div>
                    <input class="equation" type="text" autofocus name="equation" data-color="#ff0000" data-dimension="2d">
                    <button class="equation-delete">x</button>
                    <button class="color-pick">✎</button>
                    <div class="extend-div">
                        <button class="extend-z">Extend to Z</p>
                    </div>
                </div>
            </div>
        </div>
        <div id="maincanvas"></div>
        <div class="edit-color">
            <button class="ec-red" data-color="#ff0000">R</button>
            <button class="ec-green" data-color="#008000">G</button>
            <button class="ec-blue" data-color="#0000ff">B</button>
            <button class="ec-yellow" data-color="#ffff00">Y</button>
            <button class="ec-orange" data-color="#ffa500">O</button>
            <button class="ec-brown" data-color="#800000">Br</button>
        </div>
    </main>
    <template id="equation-input-template">
        <div class="equations-input-box">
            <div class="e-input-box-left">
                <p class="equation-number">1</p>
            </div>
            <div class="vr"></div>
            <input class="equation" type="text" autofocus data-color="#ffffff" data-dimension="2d">
            <button class="equation-delete">x</button>
            <button class="color-pick">✎</button>
            <div class="extend-div">
                <button class="extend-z">Extend to Z</button>
            </div>
        </div>
    </template>
    <script type="importmap">
        {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@latest/lib/browser/math.js"></script>
    <script type="module" src="3dcalc.js"></script>
</body>
</html>
